name: Build Noor APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download complete Sahih Bukhari and Sahih Muslim
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets/hadith

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/AhmedBaset/hadith-json/v1.2.0/db/by_book/the_9_books/bukhari.json" \
            -o app/src/main/assets/hadith/bukhari.json

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/AhmedBaset/hadith-json/v1.2.0/db/by_book/the_9_books/muslim.json" \
            -o app/src/main/assets/hadith/muslim.json

          test -s app/src/main/assets/hadith/bukhari.json
          test -s app/src/main/assets/hadith/muslim.json

          echo "Hadith databases downloaded successfully."

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Noor-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-debug-apk
          path: dist/Noor-debug.apk
